<!-- Declares that this file is an HTML5 document so the browser uses standard mode -->
<!DOCTYPE html>
<!-- Opens the root element; lang="en" tells browsers and screen readers the page is in English -->
<html lang="en">
<!-- Opens the head, which holds information about the page that is not shown in the body -->
<head>
    <!-- Sets the character encoding to UTF-8 so symbols like the copyright sign display correctly -->
    <meta charset="UTF-8">
    <!-- Makes the page scale properly on phones and small screens -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Sets the text shown on the browser tab -->
    <title>My First Web Page</title>
    <!-- Opens a style block where CSS rules for this page are written -->
    <style>
        /* Styles the whole page body */
        body {
            /* Uses a clean sans-serif font */
            font-family: Arial, Helvetica, sans-serif;
            /* Limits the line length so text is easy to read */
            max-width: 700px;
            /* Centers the content horizontally on the screen */
            margin: 40px auto;
            /* Adds space inside the edges of the page */
            padding: 0 20px;
            /* Sets a dark gray text color that is easy on the eyes */
            color: #222222;
        }
        /* Styles the footer at the bottom of the page */
        footer {
            /* Adds space between the page content and the footer */
            margin-top: 40px;
            /* Draws a thin line above the footer to separate it */
            border-top: 1px solid #cccccc;
            /* Adds space between the line and the footer text */
            padding-top: 12px;
            /* Makes the footer text slightly smaller */
            font-size: 0.9em;
            /* Makes the footer text a softer gray */
            color: #555555;
        }
    /* Closes the style block */
    </style>
<!-- Closes the head section -->
</head>
<!-- Opens the body, which holds everything visible on the page -->
<body>
    <!-- Main heading (largest heading) showing the page title -->
    <h1>My First Web Page</h1>
    <!-- Displays my name -->
    <p><strong>Name:</strong> Ahabab Chowdhury</p>
    <!-- Displays my username (UCID) -->
    <p><strong>Username:</strong> ac2788</p>
    <!-- Displays the course name -->
    <p><strong>Course Name:</strong> Introduction to Website Development</p>
    <!-- Displays the course number -->
    <p><strong>Course Number:</strong> IS 117</p>
    <!-- Displays the course section -->
    <p><strong>Section:</strong> 003</p>
    <!-- Opens the footer element, used for closing information at the bottom of a page -->
    <footer>
        <!-- Shows the copyright symbol (&copy;), my name, and the assignment due date -->
        <p>&copy; Ahabab Chowdhury | Due: October 6, 2026</p>
    <!-- Closes the footer -->
    </footer>
<!-- Closes the body section -->
</body>
<!-- Closes the root html element, ending the document -->
</html>
